name: NSE Derivatives Monitor

on:
  schedule:
    # Weekdays ~20:15 IST (14:45 UTC) - after NSE EOD archives are published
    - cron: "45 14 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "One-off: fetch this many calendar days of participant OI history (0 = normal run)"
        required: false
        default: "0"
      fut_backfill_days:
        description: "One-off: backfill this many days of futures settle/OI history (rollover context)"
        required: false
        default: "0"
      force_weekly:
        description: "Force the weekly digest now (normally auto-runs only on Fridays)"
        type: boolean
        required: false
        default: false
      force_rollover:
        description: "Force the monthly rollover special now (normally only within 7 days of expiry)"
        type: boolean
        required: false
        default: false
      test_alert:
        description: "Send a test alert through the configured channels (Telegram / GitHub issue)"
        type: boolean
        required: false
        default: false
      skip_connectivity_test:
        description: "Skip the connectivity smoke test"
        type: boolean
        required: false
        default: false

concurrency:
  group: nse-monitor
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Connectivity smoke test
        if: ${{ !inputs.skip_connectivity_test }}
        run: python test_connectivity.py

      - name: Refresh participant OI history (if requested)
        if: ${{ inputs.backfill_days != '' && inputs.backfill_days != '0' }}
        run: python nse_deriv_monitor.py --backfill ${{ inputs.backfill_days }}

      - name: Refresh futures history (if requested)
        if: ${{ inputs.fut_backfill_days != '' && inputs.fut_backfill_days != '0' }}
        run: python nse_deriv_monitor.py --backfill-fut ${{ inputs.fut_backfill_days }}

      - name: Run monitor
        run: python nse_deriv_monitor.py 2>&1 | tee monitor_run.log

      - name: Weekly digest (Fridays)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ inputs.force_weekly }}" = "true" ]; then FLAGS="$FLAGS --force"; fi
          python weekly_digest.py $FLAGS 2>&1 | tee -a monitor_run.log

      - name: Monthly rollover special (near expiry)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ inputs.force_rollover }}" = "true" ]; then FLAGS="$FLAGS --force"; fi
          python rollover_special.py $FLAGS 2>&1 | tee -a monitor_run.log

      - name: Build trends dashboard
        run: python make_trends.py 2>&1 | tee -a monitor_run.log

      - name: Send alerts (if triggered)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ inputs.test_alert }}" = "true" ]; then FLAGS="--test"; fi
          python send_alerts.py $FLAGS 2>&1 | tee -a monitor_run.log

      - name: Publish dashboard to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REPORT=$(ls -t output/monitor_*.html | head -1)
          REPORT_JSON=$(ls -t output/monitor_*.json | head -1)
          STAMP=$(basename "$REPORT" .html | sed 's/^monitor_//')
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/pages
          git worktree add --detach /tmp/pages HEAD
          cd /tmp/pages
          git checkout --orphan gh-pages
          git rm -rf . >/dev/null 2>&1 || true
          cp "$GITHUB_WORKSPACE/$REPORT" "monitor_${STAMP}.html"
          cp "$GITHUB_WORKSPACE/$REPORT" index.html
          cp "$GITHUB_WORKSPACE/$REPORT_JSON" latest.json
          cp "$GITHUB_WORKSPACE/output/trends.html" trends.html
          if [ -f "$GITHUB_WORKSPACE/output/weekly.html" ]; then
            cp "$GITHUB_WORKSPACE/output/weekly.html" weekly.html
          fi
          if [ -f "$GITHUB_WORKSPACE/output/rollover.html" ]; then
            cp "$GITHUB_WORKSPACE/output/rollover.html" rollover.html
          fi
          # dated archive pages (weekly digests + rollover specials)
          for f in "$GITHUB_WORKSPACE"/output/weekly_2*.html; do
            if [ -e "$f" ]; then cp "$f" "$(basename "$f")"; fi
          done
          for f in "$GITHUB_WORKSPACE"/output/rollover_2*.html; do
            if [ -e "$f" ]; then cp "$f" "$(basename "$f")"; fi
          done
          git add -A
          git commit -m "report ${STAMP}"
          git push "$REPO_URL" gh-pages --force

      - name: Commit history to main
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data output monitor_run.log
          git commit -m "monitor run $(date +%Y-%m-%d %H:%M %Z)" || echo "no changes to commit"
          git push
